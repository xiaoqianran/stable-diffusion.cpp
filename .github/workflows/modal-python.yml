name: Modal Python

on:
  pull_request:
    paths:
      - "examples/modal/**"
      - "CMakeLists.txt"
      - "tests/**"
      - "src/**"
      - "include/**"
      - "docker/Dockerfile.cuda"
      - ".github/workflows/modal-python.yml"
      - ".github/workflows/reliability.yml"
      - ".github/workflows/modal-deploy.yml"
  push:
    branches:
      - master
    paths:
      - "examples/modal/**"
      - "CMakeLists.txt"
      - "tests/**"
      - "src/**"
      - "include/**"
      - "docker/Dockerfile.cuda"
      - ".github/workflows/modal-python.yml"
      - ".github/workflows/reliability.yml"
      - ".github/workflows/modal-deploy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/modal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Check Web modules
        run: |
          node --check web/static/ux-core.js
          node --check web/static/ux-create.js
          node --check web/static/ux-runs.js
          node --check web/static/ux-gallery.js
          node --check web/static/ux-system.js
          node --check web/static/ux-main.js
      - name: Run tests
        run: uv run pytest
