name: Modal Python

on:
  push:
    branches:
      - fix/reliability-hardening
    paths:
      - ".reliability-upload/**"
      - ".github/workflows/modal-python.yml"

permissions:
  contents: write

concurrency:
  group: reliability-bootstrap
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reliability-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .reliability-upload/part-* | base64 -d | gzip -dc > /tmp/reliability.patch
          echo "dfd8a038c8d1845ddb40cb7def4062960e3e050089a64e2dd67710fdfe198a5c  /tmp/reliability.patch" | sha256sum -c -
          git apply --binary --whitespace=nowarn \
            --exclude=.github/workflows/build.yml \
            --exclude=.github/workflows/modal-deploy.yml \
            /tmp/reliability.patch
          git diff --check
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        working-directory: examples/modal
        run: uv sync --frozen
      - name: Check Web modules
        shell: bash
        run: |
          set -euo pipefail
          for f in examples/modal/web/static/ux-*.js; do node --check "$f"; done
      - name: Run Modal/Web tests
        working-directory: examples/modal
        run: uv run pytest
      - name: Static Python and C++ checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q examples/modal
          g++ -std=c++17 -fsyntax-only -Iinclude tests/test_public_api.cpp
      - name: Commit validated code patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .reliability-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/*'
          git commit -m "fix(modal): harden runtime integrity and durable jobs"
          git push origin HEAD:fix/reliability-hardening
