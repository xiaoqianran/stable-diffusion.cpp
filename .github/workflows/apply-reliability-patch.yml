name: Apply Reliability Patch

on:
  push:
    branches:
      - fix/reliability-hardening

permissions:
  contents: write

concurrency:
  group: apply-reliability-patch
  cancel-in-progress: true

jobs:
  apply:
    if: "${{ github.event.head_commit.message != 'fix(modal): harden runtime integrity and durable jobs' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reliability-hardening
          fetch-depth: 0
      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .reliability-upload/part-* | base64 -d | gzip -dc > /tmp/reliability.patch
          echo "dfd8a038c8d1845ddb40cb7def4062960e3e050089a64e2dd67710fdfe198a5c  /tmp/reliability.patch" | sha256sum -c -
          git apply --binary --whitespace=nowarn /tmp/reliability.patch
          git diff --check
      - name: Static sanity checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q examples/modal
          for f in examples/modal/web/static/ux-*.js; do node --check "$f"; done
          g++ -std=c++17 -fsyntax-only -Iinclude tests/test_public_api.cpp
      - name: Commit final patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .reliability-upload .github/workflows/apply-reliability-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(modal): harden runtime integrity and durable jobs"
          git push origin HEAD:fix/reliability-hardening
