[project]
name = "sdcpp-modal-cli"
version = "0.1.0"
description = "Standalone Modal CLI for stable-diffusion.cpp image generation"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
modal = ["modal>=0.64"]
gallery = ["huggingface_hub>=0.26"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "pillow>=10", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "fastapi>=0.115", "httpx>=0.27", "pillow>=10", "python-multipart>=0.0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
