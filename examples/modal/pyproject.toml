[project]
name = "sdcpp-modal-cli"
version = "0.1.0"
description = "Standalone Modal CLI for stable-diffusion.cpp image generation"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "modal[api-proxy-support]>=1.0.0",
    "huggingface_hub>=0.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
