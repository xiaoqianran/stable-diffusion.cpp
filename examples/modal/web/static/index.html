<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e0f12" />
  <meta name="color-scheme" content="dark" />
  <title>sdcpp-modal · Image Lab</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/ux.css" />
</head>
<body>
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div id="app-shell" class="app-shell">
    <header class="topbar">
      <a class="brand" href="#/create" aria-label="sdcpp-modal Image Lab 首页">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-copy"><strong>sdcpp</strong><small>IMAGE LAB</small></span>
      </a>
      <nav class="primary-nav" aria-label="主要导航">
        <a href="#/create" data-route="create"><span>创建</span></a>
        <a href="#/runs" data-route="runs"><span>运行</span><b id="run-count" hidden>0</b></a>
        <a href="#/gallery" data-route="gallery"><span>图库</span></a>
      </nav>
      <div class="topbar-actions">
        <button id="queue-button" class="system-chip" type="button" aria-haspopup="dialog">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="queue-label">检查 GPU…</span>
        </button>
        <button id="system-button" class="icon-button" type="button" aria-label="系统状态" title="系统状态">•••</button>
      </div>
    </header>

    <main id="workspace" class="workspace" tabindex="-1"></main>

    <nav class="mobile-nav" aria-label="移动端导航">
      <a href="#/create" data-route="create">创建</a>
      <a href="#/runs" data-route="runs">运行</a>
      <a href="#/gallery" data-route="gallery">图库</a>
    </nav>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <dialog id="image-dialog" class="image-dialog"></dialog>
  <dialog id="system-dialog" class="system-dialog"></dialog>

  <script src="/static/ux-main.js" type="module"></script>
</body>
</html>
